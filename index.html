    { kategori: "Sistem Respirasi", tipe: "bs", pertanyaan: "Antibiotik sangat efektif digunakan untuk menyembuhkan penyakit saluran pernapasan yang disebabkan oleh infeksi virus murni seperti *The Common Cold* atau flu biasa.", kunci_jawaban: "Salah" },
    { kategori: "Sistem Respirasi", tipe: "essay", pertanyaan: "Uraikan bagaimana sistem pertukaran gas bekerja pada hewan akuatik (ikan melalui insang) dan pada serangga (lewat sistem trakea), serta sebutkan struktur utama yang mendukung efisiensi pertukaran gas pada keduanya!", kunci_jawaban: "Pada ikan, pertukaran gas terjadi di dalam insang yang terdiri atas filamen dan lamela dengan bantuan sistem 'countercurrent exchange' (arus berlawanan antara aliran air dan darah kapiler) untuk memaksimalkan difusi oksigen terlarut. Pada serangga, pertukaran gas tidak melibatkan darah secara langsung, melainkan menggunakan sistem trakea di mana udara luar masuk melalui lubang spirakel di sisi tubuh, lalu disalurkan melalui jaringan tabung trakea dan trakeolus yang mengantar oksigen langsung ke sel-sel tubuh." },
    { kategori: "Sistem Respirasi", tipe: "essay", pertanyaan: "Jelaskan proses pertukaran gas oksigen ($O_2$) dan karbon dioksida ($CO_2$) yang terjadi di dalam struktur alveoli paru-paru manusia!", kunci_jawaban: "Pertukaran gas di alveoli terjadi secara difusi berdasarkan perbedaan tekanan parsial. Oksigen di dalam rongga alveoli memiliki konsentrasi/tekanan parsial yang lebih tinggi dibandingkan dengan darah kapiler yang miskin oksigen, sehingga $O_2$ berdifusi masuk ke dalam darah. Sebaliknya, karbon dioksida di dalam darah kapiler memiliki konsentrasi lebih tinggi daripada di alveoli, sehingga $CO_2$ berdifusi keluar dari darah ke dalam alveoli untuk kemudian dihembuskan keluar tubuh." },
    { kategori: "Sistem Respirasi", tipe: "essay", pertanyaan: "Sebutkan dan jelaskan tiga jenis penyakit atau gangguan kesehatan utama yang menyerang sistem pernapasan manusia beserta penyebab singkatnya!", kunci_jawaban: "Tiga contoh gangguan pernapasan manusia meliputi: (1) Asma, yaitu penyempitan bronkiolus akibat kejang otot polos karena iritasi; (2) Pneumonia, yaitu infeksi bakteri atau virus di mana alveoli terisi cairan dan nanah; serta (3) Tuberkulosis (TB), yaitu infeksi paru-paru kronis yang disebabkan oleh bakteri *Mycobacterium tuberculosis*." },

    { kategori: "Keanekaragaman Hayati", tipe: "essay", pertanyaan: "Jelaskan definisi keanekaragaman hayati dan sebutkan empat tingkatan utama keanekaragaman hayati yang membentuk sistem kehidupan di bumi!", kunci_jawaban: "Keanekaragaman hayati adalah kekayaan berbagai spesies bumi, variasi genetik, serta keragaman ekosistem dan proses ekologinya. Empat tingkatan utamanya meliputi: (1) Keanekaragaman genetik; (2) Keanekaragaman spesies; (3) Keanekaragaman ekosistem; dan (4) Keanekaragaman fungsional." },
    { kategori: "Keanekaragaman Hayati", tipe: "essay", pertanyaan: "Uraikan peran penting dari proses evolusi seperti mutasi, seleksi alam, dan isolasi geografis dalam membentuk keanekaragaman hayati!", kunci_jawaban: "Mutasi menghasilkan perubahan genetik baru sebagai sumber variasi. Seleksi alam menyaring individu yang paling cocok dengan lingkungan untuk bertahan hidup dan berkembang biak. Sementara itu, isolasi geografis memisahkan populasi dalam waktu lama sehingga masing-masing populasi beradaptasi secara mandiri dan dapat membentuk spesies baru." },
    { kategori: "Keanekaragaman Hayati", tipe: "essay", pertanyaan: "Sebutkan dan jelaskan karakteristik utama dari tiga tipe ekosistem hutan atau vegetasi yang dapat ditemui di wilayah pesisir dan daratan Indonesia!", kunci_jawaban: "Tiga tipe ekosistem meliputi: (1) Hutan Mangrove, yaitu vegetasi di kawasan pasang surut berlumpur dengan tumbuhan berakar napas seperti Avicennia dan Rhizophora; (2) Hutan Rawa Gambut, yaitu kawasan berair dengan endapan gambut tebal dan tingkat keasaman (pH) rendah di bawah 4; serta (3) Hutan Hujan Dataran Rendah Tropis, yaitu hutan dengan kekayaan jenis pohon yang sangat tinggi, berkanopi rapat, dan memiliki ciri khas struktur akar papan." }
];

let soalAktif = [], indeksSoal = 0, jawabanUser = [];

function initMenu() {
    const container = document.getElementById('menu-container');
    container.innerHTML = ''; 
    const kategoriUnik = [...new Set(databaseSoal.map(s => s.kategori))];
    kategoriUnik.forEach(k => {
        const btn = document.createElement('button');
        btn.className = 'btn-outline';
        btn.innerText = k;
        btn.onclick = () => startQuiz(k);
        container.appendChild(btn);
    });
}

function startQuiz(k) {
    soalAktif = k === 'Semua Topik' ? [...databaseSoal].sort(() => Math.random() - 0.5) : databaseSoal.filter(s => s.kategori === k);
    indeksSoal = 0; 
    jawabanUser = new Array(soalAktif.length).fill(""); 
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none'; 
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('current-category-text').innerText = k;
    renderSoal();
}

function renderSoal() {
    const s = soalAktif[indeksSoal];
    document.getElementById('question-counter').innerText = `Soal ${indeksSoal + 1} / ${soalAktif.length}`;
    document.getElementById('progress-bar').style.width = `${((indeksSoal + 1) / soalAktif.length) * 100}%`;
    document.getElementById('question-text').innerText = s.pertanyaan;
    
    const container = document.getElementById('answer-container');
    container.innerHTML = '';

    if (s.tipe === 'pg') {
        const div = document.createElement('div');
        div.className = 'options-list';
        s.pilihan.forEach(o => {
            const lbl = document.createElement('label'); 
            lbl.className = 'option-item' + (jawabanUser[indeksSoal] === o ? ' selected' : '');
            lbl.innerHTML = `<input type="radio" name="opt" ${jawabanUser[indeksSoal] === o ? 'checked' : ''}> ${o}`;
            lbl.onclick = () => {
                jawabanUser[indeksSoal] = o;
                renderSoal(); 
            };
            div.appendChild(lbl);
        });
        container.appendChild(div);
    } else if (s.tipe === 'bs') {
        const div = document.createElement('div');
        div.className = 'options-list';
        const pilihanBS = ["Benar", "Salah"];
        pilihanBS.forEach(o => {
            const lbl = document.createElement('label'); 
            lbl.className = 'option-item' + (jawabanUser[indeksSoal] === o ? ' selected' : '');
            lbl.innerHTML = `<input type="radio" name="opt" ${jawabanUser[indeksSoal] === o ? 'checked' : ''}> ${o}`;
            lbl.onclick = () => {
                jawabanUser[indeksSoal] = o;
                renderSoal(); 
            };
            div.appendChild(lbl);
        });
        container.appendChild(div);
    } else {
        const txt = document.createElement('textarea');
        txt.className = 'essay-area';
        txt.placeholder = 'Tuliskan jawaban Anda di sini...';
        txt.value = jawabanUser[indeksSoal];
        txt.oninput = (e) => { jawabanUser[indeksSoal] = e.target.value; };
        container.appendChild(txt);
    }

    document.getElementById('btn-prev').style.display = indeksSoal === 0 ? 'none' : 'block';
    document.getElementById('btn-next').style.display = indeksSoal === soalAktif.length - 1 ? 'none' : 'block';
}

function nextQuestion() { if (indeksSoal < soalAktif.length - 1) { indeksSoal++; renderSoal(); } }
function prevQuestion() { if (indeksSoal > 0) { indeksSoal--; renderSoal(); } }

function showResults() {
    const belum = jawabanUser.filter(j => j === "").length;
    if (belum > 0) {
        if (!confirm(`Masih ada ${belum} soal belum diisi. Tetap ingin mengakhiri dan lihat hasil?`)) return;
    }

    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    
    let skor = 0;
    let objektifTotal = 0;
    const rev = document.getElementById('review-container'); rev.innerHTML = '';
    
    soalAktif.forEach((s, i) => {
        const u = jawabanUser[i];
        const card = document.createElement('div'); card.className = 'review-card';
        
        if(s.tipe === 'pg' || s.tipe === 'bs') {
            objektifTotal++;
            let isWrong = u !== s.kunci_jawaban;
            if (isWrong) card.classList.add('wrong-pg');
            if (!isWrong && u !== "") skor++;
            
            card.innerHTML = `
                <div>
                    <span class="review-badge">${s.tipe.toUpperCase()}</span>
                    <span style="font-weight:bold">${i+1}. ${s.pertanyaan}</span>
                </div>
                <div class="ans-user">${u === "" ? "Tidak diisi" : u} ${u === "" ? "" : (isWrong ? '<span style="color:red; font-weight:bold"> (Salah)</span>' : '<span style="color:green; font-weight:bold"> (Benar)</span>')}</div>
                <div style="font-size:12px; color:#666; margin-top:10px">Jawaban Kunci:</div>
                <div class="ans-ref">${s.kunci_jawaban}</div>
            `;
        } else {
            card.innerHTML = `
                <div>
                    <span class="review-badge">ESSAY</span>
                    <span style="font-weight:bold">${i+1}. ${s.pertanyaan}</span>
                </div>
                <div style="font-size:12px; color:#666; margin-top:15px;">Jawaban Anda:</div>
                <div class="ans-user" style="white-space: pre-wrap;">${u === "" ? "Tidak diisi" : u}</div>
                <div style="font-size:12px; color:#666; margin-top:10px">Referensi Jawaban Kunci:</div>
                <div class="ans-ref">${s.kunci_jawaban}</div>
            `;
        }
        rev.appendChild(card);
    });
    
    document.getElementById('score-category-name').innerText = document.getElementById('current-category-text').innerText;
    document.getElementById('score-text-total').innerText = `${skor} / ${objektifTotal}`;
    window.scrollTo(0,0);
}

initMenu();
</script>
</body>
</html>
